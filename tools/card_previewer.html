<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Rubii Card Architect - Live Mobile Previewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;600&family=Chonburi&family=Kanit:ital,wght@0,300;0,400;0,600;1,300&family=Mitr:wght@400;600&family=Prompt:wght@300;400;600&family=Sarabun:wght@300;400;600&family=Taviraj:wght@300;400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a10;
      --card-bg: #121420;
      --accent: #00ffff;
      --accent-pink: #ff007f;
      --text: #f0f4f8;
      --border: #222638;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Kanit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: rgba(18, 20, 32, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button {
      background: #1c2033;
      color: #fff;
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    select:hover, button:hover {
      border-color: var(--accent);
    }
    button.primary {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      border: none;
      font-weight: 600;
    }
    .main-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }
    @media (max-width: 900px) {
      .main-container { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    textarea {
      width: 100%;
      height: 520px;
      background: #090a10;
      color: #79ffe1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .preview-viewport-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 10px;
      min-height: 540px;
      background-image: radial-gradient(#1c2033 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .device-frame {
      width: 100%;
      max-width: 420px;
      transition: max-width 0.3s ease;
      background: transparent;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>⚡</span> Rubii Card Architect V2.2.7 — Live Tester
    </div>
    <div class="controls">
      <label style="font-size:11px;color:#8892b0;">Preset:</label>
      <select id="presetSelect" onchange="loadPreset()">
        <option value="diana-racer">🏍️ Diana Racer (Master Official Card)</option>
        <option value="base-clean">📦 Base Card Template (การ์ดพื้นฐาน)</option>
        <option value="cyber-gothic">Cyber-Gothic (Neon Crimson)</option>
        <option value="arcane-academia">Arcane Academia (Violet Gold)</option>
        <option value="pastel-glitch">Pastel Glitch (Cute Synthwave)</option>
        <option value="solar-steampunk">Solar Steampunk (Emerald Brass)</option>
        <option value="quiet-luxury">Quiet Luxury (Old Money Noir)</option>
      </select>

      <label style="font-size:11px;color:#8892b0;margin-left:6px;">Width:</label>
      <select id="widthSelect" onchange="changeWidth()">
        <option value="420px">Standard (420px)</option>
        <option value="440px">Max Bound (440px)</option>
        <option value="390px">iPhone 14/15 (390px)</option>
        <option value="375px">iPhone SE / Mini (375px)</option>
        <option value="320px">Minimum Fluid (320px)</option>
      </select>
      <button class="primary" onclick="renderPreview()">▶ Render Live</button>
    </div>
  </header>

  <div class="main-container">
    <div class="panel">
      <div class="panel-header">
        <span>📝 HTML / CSS Source Code</span>
        <button onclick="copyCode()" style="padding:2px 8px;font-size:11px;">📋 Copy</button>
      </div>
      <textarea id="codeEditor" spellcheck="false" placeholder="Paste your generated Rubii HTML/CSS card code here..."></textarea>
      <div style="font-size:11px;color:#8892b0;display:flex;justify-content:space-between;">
        <span>💾 Auto-saves to LocalStorage</span>
        <span onclick="resetCode()" style="cursor:pointer;color:#ff66c4;">🔄 Reset to Diana Master</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>📱 Mobile Viewport Simulation</span>
        <span id="dimensionLabel" style="font-size:11px;color:#8892b0;">420px</span>
      </div>
      <div class="preview-viewport-wrapper">
        <div class="device-frame" id="deviceFrame">
          <div id="previewTarget"></div>
        </div>
      </div>
    </div>
  </div>
