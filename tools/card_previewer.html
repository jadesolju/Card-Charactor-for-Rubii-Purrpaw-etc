<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Rubii Card Architect - Live Mobile Previewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;600&family=Chonburi&family=Kanit:ital,wght@0,300;0,400;0,600;1,300&family=Mitr:wght@400;600&family=Prompt:wght@300;400;600&family=Sarabun:wght@300;400;600&family=Taviraj:wght@300;400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a10;
      --card-bg: #121420;
      --accent: #00ffff;
      --accent-pink: #ff007f;
      --text: #f0f4f8;
      --border: #222638;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Kanit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 14px 24px;
      background: rgba(18, 20, 32, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button {
      background: #1c2033;
      color: #fff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    select:hover, button:hover {
      border-color: var(--accent);
    }
    button.primary {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      border: none;
      font-weight: 600;
    }
    .main-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }
    @media (max-width: 900px) {
      .main-container { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    textarea {
      width: 100%;
      height: 480px;
      background: #090a10;
      color: #79ffe1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .preview-viewport-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 10px;
      min-height: 520px;
      background-image: radial-gradient(#1c2033 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .device-frame {
      width: 100%;
      max-width: 440px;
      transition: max-width 0.3s ease;
      background: transparent;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>⚡</span> Rubii Card Architect V2.2.7 — Live Tester
    </div>
    <div class="controls">
      <label style="font-size:12px;color:#8892b0;">Preset:</label>
      <select id="presetSelect" onchange="loadPreset()">
        <option value="cyber-gothic">Cyber-Gothic (Neon Crimson)</option>
        <option value="arcane-academia">Arcane Academia (Violet Gold)</option>
        <option value="pastel-glitch">Pastel Glitch (Cute Synthwave)</option>
        <option value="solar-steampunk">Solar Steampunk (Emerald Brass)</option>
        <option value="quiet-luxury">Quiet Luxury (Old Money Noir)</option>
      </select>

      <label style="font-size:12px;color:#8892b0;margin-left:8px;">Width:</label>
      <select id="widthSelect" onchange="changeWidth()">
        <option value="440px">Max Bound (440px)</option>
        <option value="390px">iPhone 14/15 (390px)</option>
        <option value="375px">iPhone SE / Mini (375px)</option>
        <option value="320px">Minimum Fluid (320px)</option>
      </select>
      <button class="primary" onclick="renderPreview()">▶ Render Live</button>
    </div>
  </header>

  <div class="main-container">
    <div class="panel">
      <div class="panel-header">
        <span>📝 HTML / CSS Source Code</span>
        <button onclick="copyCode()" style="padding:3px 8px;font-size:11px;">📋 Copy</button>
      </div>
      <textarea id="codeEditor" spellcheck="false" placeholder="Paste your generated Rubii HTML/CSS card code here..."></textarea>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>📱 Mobile Viewport Simulation</span>
        <span id="dimensionLabel" style="font-size:12px;color:#8892b0;">440px</span>
      </div>
      <div class="preview-viewport-wrapper">
        <div class="device-frame" id="deviceFrame">
          <div id="previewTarget"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const presets = {
      'cyber-gothic': `<style>
@keyframes cyberGlow{0%,100%{box-shadow:0 0 12px #ff0055,inset 0 0 8px #00ffff;}50%{box-shadow:0 0 20px #00ffff,inset 0 0 12px #ff0055;}}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.3;transform:scale(0.8);}}
.cg-card{width:100vw;max-width:440px;margin:0 auto;box-sizing:border-box;font-family:'Chonburi','Kanit',serif;background:rgba(10,5,12,0.85)!important;border:2px solid #ff0055!important;border-radius:12px;padding:16px;color:#f3e8ee!important;animation:cyberGlow 4s infinite ease-in-out;user-select:text!important;}
.cg-tag{display:inline-block;padding:2px 8px;font-size:clamp(8px,2.5vw,11px);border:1px solid #00ffff;color:#00ffff!important;border-radius:4px;text-transform:uppercase;letter-spacing:1px;}
.cg-title{font-size:clamp(18px,5vw,26px);color:#fff!important;text-shadow:0 0 8px #ff0055;margin:8px 0 4px 0;}
.cg-sub{font-size:clamp(9px,3vw,12px);color:#00ffff!important;letter-spacing:2px;font-family:'Kanit',sans-serif;}
.cg-divider{height:1px;background:linear-gradient(90deg,transparent,#ff0055,#00ffff,transparent);margin:12px 0;}
.cg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:clamp(8px,3vw,12px);font-family:'Kanit',sans-serif;}
.cg-key{color:#a78bfa!important;font-weight:bold;}
.cg-val{color:#fff!important;}
.cg-details{margin-top:10px;border:1px solid rgba(255,0,85,0.4);border-radius:6px;background:rgba(0,0,0,0.4);overflow:hidden;}
.cg-summary{padding:8px 12px;cursor:pointer;background:rgba(255,0,85,0.15);color:#00ffff!important;font-family:'Kanit',sans-serif;list-style:none;}
.cg-content{padding:10px 12px;font-size:clamp(8px,3.2vw,12px);line-height:1.5;color:#e2e8f0!important;font-family:'Kanit',sans-serif;max-height:150px;overflow-y:auto;}
</style>
<div class="cg-card">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <span class="cg-tag">[ STATUS: CLASSIFIED ]</span>
    <span style="display:inline-block;width:8px;height:8px;background:#ff0055;border-radius:50%;box-shadow:0 0 6px #ff0055;animation:pulseDot 1.5s infinite;"></span>
  </div>
  <h1 class="cg-title">VALENTINA CROSS</h1>
  <div class="cg-sub">// CYBERNETIC NOCTURNE ARCHON</div>
  <div class="cg-divider"></div>
  <div class="cg-grid">
    <div><span class="cg-key">AFFILIATION:</span> <span class="cg-val">Sector 09 Blood Syndicate</span></div>
    <div><span class="cg-key">ORIGIN:</span> <span class="cg-val">Neo-Verona Core</span></div>
  </div>
  <details class="cg-details" open>
    <summary class="cg-summary">⚔️ PROFILE DOSSIER & LORE</summary>
    <div class="cg-content">
      • แวมไพร์สายเลือดโบราณผู้ผสานระบบอวัยวะกลจักรกลสังเคราะห์<br>
      • ควบคุมเครือข่ายตลาดมืดและข้อมูลลับแห่ง Sector 09<br>
      • เป้าหมาย: ปลดแอกชนชั้นใต้ดินด้วยพลังเวทไซเบอร์เนติกส์
    </div>
  </details>
</div>`,
      'arcane-academia': `<style>
.aa-card{width:100vw;max-width:440px;margin:0 auto;box-sizing:border-box;font-family:'Chonburi','Taviraj',serif;background:rgba(18,12,28,0.85)!important;border:2px solid #d4af37!important;border-radius:8px;padding:16px;color:#f3e8ff!important;box-shadow:0 0 16px rgba(124,58,237,0.45);user-select:text!important;}
.aa-title{font-size:clamp(18px,4.8vw,24px);color:#ffd700!important;text-shadow:0 0 6px #c084fc;margin:8px 0 2px 0;}
.aa-details{margin-top:8px;border:1px solid rgba(212,175,55,0.3);border-radius:4px;}
.aa-summary{padding:8px 10px;cursor:pointer;background:rgba(212,175,55,0.15);color:#ffd700!important;font-size:clamp(10px,3.2vw,12px);font-weight:bold;}
.aa-content{padding:8px 10px;font-size:clamp(8px,3vw,11px);line-height:1.6;color:#ddd6fe!important;font-family:'Anuphan',serif;}
</style>
<div class="aa-card">
  <div style="font-size:10px;color:#d4af37;letter-spacing:1px;">📜 THE ARCHIVE OF SOLOMON</div>
  <h1 class="aa-title">AURELIUS VANE</h1>
  <div style="font-size:10px;color:#a78bfa;font-style:italic;">// GRAND SCHOLAR OF THE FORBIDDEN CIRCLE</div>
  <details class="aa-details" open>
    <summary class="aa-summary">⚡ RUNIC STATUS</summary>
    <div class="aa-content">
      • สังกัด: หอสมุดมนตร์ดำหลวงแห่งอาคาเดเมีย<br>
      • พลังพิเศษ: ถอดรหัสอักษรโบราณ และเชื่อมโยงวงแหวนมิติ
    </div>
  </details>
</div>`,
      'pastel-glitch': `<style>
.pg-card{width:100vw;max-width:440px;margin:0 auto;box-sizing:border-box;font-family:'Kanit',sans-serif;background:rgba(20,15,30,0.88)!important;border:2px dashed #ff66c4!important;border-radius:18px;padding:16px;color:#fff!important;user-select:text!important;}
.pg-title{font-size:clamp(18px,5vw,26px);color:#ffc6ff!important;text-shadow:0 0 8px #ff66c4;margin:10px 0 2px 0;}
.pg-details{margin-top:10px;border:1px solid #ff66c4;border-radius:10px;background:rgba(255,102,196,0.08);}
.pg-summary{padding:8px 12px;cursor:pointer;color:#ffc6ff!important;font-size:12px;font-weight:bold;}
.pg-content{padding:8px 12px;font-size:11px;line-height:1.5;color:#e2e8f0!important;}
</style>
<div class="pg-card">
  <span style="background:linear-gradient(45deg,#ff66c4,#66e6ff);color:#140f1e;font-size:10px;font-weight:bold;padding:3px 10px;border-radius:20px;">👾 LEVEL 99 IDOL</span>
  <h1 class="pg-title">NANO CHIBI 01</h1>
  <details class="pg-details" open>
    <summary class="pg-summary">🎀 STREAM INFO</summary>
    <div class="pg-content">• นิสัย: ร่าเริง ซน ป่วนเซิร์ฟเวอร์ด้วยไวรัสสีชมพู</div>
  </details>
</div>`,
      'solar-steampunk': `<style>
.ss-card{width:100vw;max-width:440px;margin:0 auto;box-sizing:border-box;font-family:'Taviraj',serif;background:rgba(15,25,20,0.88)!important;border:2px solid #e1b382!important;border-radius:10px;padding:16px;color:#f0fdf4!important;box-shadow:0 0 14px rgba(57,255,20,0.35);user-select:text!important;}
.ss-title{font-size:clamp(18px,4.8vw,24px);color:#e1b382!important;text-shadow:0 0 8px #39ff14;margin:8px 0 2px 0;}
</style>
<div class="ss-card">
  <span style="font-size:10px;color:#39ff14;border:1px solid #39ff14;padding:2px 8px;border-radius:4px;">🌿 ECO-KINETIC ENGINEER</span>
  <h1 class="ss-title">INGENIEUR STERLING</h1>
  <div style="font-size:11px;color:#bbf7d0;margin-top:8px;">// SOLAR CLOCKWORK INVENTOR</div>
</div>`,
      'quiet-luxury': `<style>
.ql-card{width:100vw;max-width:440px;margin:0 auto;box-sizing:border-box;font-family:'Prompt',sans-serif;background:rgba(18,18,20,0.92)!important;border:1px solid rgba(223,216,200,0.4)!important;border-radius:4px;padding:20px 16px;color:#dfd8c8!important;box-shadow:0 12px 36px rgba(0,0,0,0.7);user-select:text!important;}
.ql-title{font-size:clamp(19px,4.5vw,25px);font-weight:300;color:#fff!important;letter-spacing:2px;margin:0 0 4px 0;}
</style>
<div class="ql-card">
  <div style="letter-spacing:3px;font-size:9px;color:#a39274;">THE SYNDICATE DIRECTORY</div>
  <h1 class="ql-title">JULIAN VANDERBILT</h1>
  <div style="font-size:10px;color:#a39274;letter-spacing:2px;font-style:italic;">// CHAIRMAN & SHADOW BENEFACTOR</div>
</div>`
    };

    function renderPreview() {
      const code = document.getElementById('codeEditor').value;
      document.getElementById('previewTarget').innerHTML = code;
    }

    function loadPreset() {
      const key = document.getElementById('presetSelect').value;
      document.getElementById('codeEditor').value = presets[key] || '';
      renderPreview();
    }

    function changeWidth() {
      const w = document.getElementById('widthSelect').value;
      document.getElementById('deviceFrame').style.maxWidth = w;
      document.getElementById('dimensionLabel').textContent = w;
    }

    function copyCode() {
      const code = document.getElementById('codeEditor').value;
      navigator.clipboard.writeText(code).then(() => {
        alert('Copied to clipboard!');
      });
    }

    // Init
    loadPreset();
  </script>
</body>
</html>
