  <style>
    :root {
      --bg: #090a10;
      --card-bg: #121420;
      --accent: #00ffff;
      --accent-pink: #ff007f;
      --text: #f0f4f8;
      --border: #222638;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Kanit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 20px;
      background: rgba(18, 20, 32, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand {
      font-size: 16px;
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, button {
      background: #1c2033;
      color: #fff;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    select:hover, button:hover {
      border-color: var(--accent);
    }
    button.primary {
      background: linear-gradient(45deg, #00f0ff, #7928ca);
      border: none;
      font-weight: 600;
    }
    button.minify-btn {
      background: linear-gradient(45deg, #ff007f, #ffaa00);
      border: none;
      font-weight: 700;
      color: #fff;
    }
    .main-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }
    @media (max-width: 900px) {
      .main-container { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .panel-actions {
      display: flex;
      gap: 6px;
    }
    textarea {
      width: 100%;
      height: 540px;
      background: #090a10;
      color: #79ffe1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .preview-viewport-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 10px;
      min-height: 540px;
      background-image: radial-gradient(#1c2033 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .device-frame {
      width: 100%;
      max-width: 420px;
      transition: max-width 0.3s ease;
      background: transparent;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>

    function renderPreview() {
      const code = document.getElementById('codeEditor').value;
      document.getElementById('previewTarget').innerHTML = code;
    }

    function loadPreset() {
      const key = document.getElementById('presetSelect').value;
      const code = presets[key] || valentinaMaster;
      document.getElementById('codeEditor').value = code;
      localStorage.setItem('rubii_saved_card_html_v227', code);
      renderPreview();
    }

    function resetCode() {
      document.getElementById('codeEditor').value = valentinaMaster;
      localStorage.setItem('rubii_saved_card_html_v227', valentinaMaster);
      renderPreview();
    }

    function changeWidth() {
      const w = document.getElementById('widthSelect').value;
      document.getElementById('deviceFrame').style.maxWidth = w;
      document.getElementById('dimensionLabel').textContent = w;
    }

    function copyCode() {
      const code = document.getElementById('codeEditor').value;
      navigator.clipboard.writeText(code).then(() => {
        alert('Copied HTML code to clipboard!');
      });
    }

    function minifyHtmlCss(code) {
      return code
        .replace(/\/\*[\s\S]*?\*\//g, '')
        .replace(/<!--[\s\S]*?-->/g, '')
        .replace(/\r?\n|\r/g, ' ')
        .replace(/\s{2,}/g, ' ')
        .replace(/>\s+</g, '><')
        .replace(/\s*([{}:;,>+~])\s*/g, '$1')
        .replace(/;\}/g, '}')
        .trim();
    }

    function copyMinifiedCode() {
      const code = document.getElementById('codeEditor').value;
      const minified = minifyHtmlCss(code);
      navigator.clipboard.writeText(minified).then(() => {
        alert(`⚡ Minified code copied! (${minified.length.toLocaleString()} chars)`);
      });
    }

    document.getElementById('codeEditor').addEventListener('input', (e) => {
      renderPreview();
      localStorage.setItem('rubii_saved_card_html_v227', e.target.value);
    });

    // Init
    const saved = localStorage.getItem('rubii_saved_card_html_v227');
    if (saved && saved.trim().length > 0) {
      document.getElementById('codeEditor').value = saved;
      renderPreview();
    } else {
      loadPreset();
    }
  </script>
