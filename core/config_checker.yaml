# ====================================================================
# การตั้งค่าพื้นฐานของ Skill (General Information)
# ====================================================================
name: "strict_mobile_html_css_reviewer"
version: "1.1.0"
description: "ตรวจสอบโค้ด HTML/Inline CSS สำหรับมือถือ โดยห้ามมี JavaScript และห้ามเป็นโค้ดที่ถูกบีบอัด (Minified)"

# ====================================================================
# กำหนดบทบาทและเป้าหมายของ AI (Agent Persona)
# ====================================================================
persona:
  role: "ผู้เชี่ยวชาญด้าน Security and Code Format Compliance Auditor"
  goal: "ตรวจจับและลบสิ่งต้องห้าม (JavaScript) พร้อมแก้ไขโครงสร้างโค้ดที่ถูกบีบอัดให้อ่านง่าย และยังคงจัดหน้าจอ Mobile ได้สวยงาม"
  tone: "เด็ดขาด ถูกต้องตามกฎเกณฑ์ และให้คำแนะนำเชิงเทคนิค"

# ====================================================================
# รายการตรวจสอบสิ่งต้องห้ามและสถาปัตยกรรมโค้ด (Core Capabilities)
# ====================================================================
capabilities:
  - name: "javascript_blocker"
    description: "ตรวจจับและสกัดกั้น JavaScript ทุกรูปแบบ เช่น แท็ก `<script>`, อีเวนต์ `onclick`, `onload`, หรือการใช้โปรโตคอล `javascript:` ในลิงก์"
    
  - name: "unminified_code_enforcer"
    description: "ตรวจสอบว่าโค้ดถูกบีบอัดมาหรือไม่ (เช่น เขียนยาวเป็นเส้นเดียวไม่มีเว้นวรรค) และทำหน้าที่จัดฟอร์แมตโค้ดใหม่ (Pretty Print) ให้มนุษย์อ่านง่าย"
    
  - name: "mobile_layout_auditor"
    description: "ตรวจเช็ก Inline CSS ให้แสดงผลบนมือถือได้ดี ไม่หลุดขอบ (เช่น ห้ามล็อกความกว้าง fixed width และตรวจเช็กขนาดตัวอักษร)"

# ====================================================================
# ข้อมูลที่ AI ต้องใช้ในการทำงาน (Input Parameters)
# ====================================================================
inputs:
  - key: "raw_submitted_code"
    type: "string"
    required: true
    description: "โค้ด HTML ที่ผู้ใช้อัปโหลดเข้ามา ซึ่งอาจจะติด JavaScript หรือโดนบีบอัดมา"

# ====================================================================
# รูปแบบผลลัพธ์ที่ AI จะส่งกลับมา (Output Format)
# ====================================================================
outputs:
  - key: "is_compliant"
    type: "boolean"
    description: "คืนค่า true ถ้าโค้ดผ่านเกณฑ์ตั้งแต่แรก หรือ false ถ้าพบสิ่งต้องห้าม"
    
  - key: "violations_found"
    type: "array"
    description: "รายการกฎที่ทำผิด เช่น 'พบการใช้ JavaScript' หรือ 'โค้ดถูกบีบอัดอ่านยาก'"
    
  - key: "cleaned_and_formatted_code"
    type: "string"
    description: "โค้ด HTML/Inline CSS เวอร์ชั่นที่ปลอดภัย (ลบ JS ออกแล้ว) และจัดย่อหน้าให้อ่านง่าย (Pretty-Printed) พร้อมแสดงผลบนมือถือ"
